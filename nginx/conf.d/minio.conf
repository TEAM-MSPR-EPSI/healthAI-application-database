# ─────────────────────────────────────────────────────────────
#  Proxy MinIO API S3  →  http://media.example.com
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name media.example.com localhost;

    # ── CORS pour les navigateurs ─────────────────────────────
    add_header 'Access-Control-Allow-Origin'  '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range' always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Médias publics — avec cache Nginx ─────────────────────
    location ~* ^/(avatars|covers|photos|thumbnails|stories)/ {
        proxy_pass         http://minio:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache 7 jours pour les médias publics
        proxy_cache             media_cache;
        proxy_cache_valid       200 7d;
        proxy_cache_valid       404 1m;
        proxy_cache_use_stale   error timeout updating;
        proxy_cache_lock        on;
        add_header X-Cache-Status $upstream_cache_status;

        # Headers cache navigateur
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Vidéos — streaming avec range requests ─────────────────
    location ~* ^/(videos)/ {
        proxy_pass              http://minio:9000;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_http_version      1.1;
        proxy_set_header        Range             $http_range;
        proxy_set_header        If-Range          $http_if_range;

        proxy_buffering         on;
        proxy_buffer_size       128k;
        proxy_buffers           8 256k;
        proxy_busy_buffers_size 512k;

        add_header Accept-Ranges bytes;
        expires 7d;
    }

    # ── API S3 complète (uploads signés, etc.) ─────────────────
    location / {
        proxy_pass              http://minio:9000;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_connect_timeout   300;
        proxy_send_timeout      300;
        proxy_read_timeout      300;
        send_timeout            300;

        client_max_body_size    500M;
        proxy_request_buffering off;   # streaming upload
    }
}

# ─────────────────────────────────────────────────────────────
#  Console MinIO  →  http://console.example.com  (admin)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name console.example.com;

    # Restreindre à un réseau interne si besoin
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass              http://minio:9001;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_http_version      1.1;
    }
}
